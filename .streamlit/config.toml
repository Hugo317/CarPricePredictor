# Fair Car Price dashboard theme: Graphite & Gold (premium automotive, dark), Space Grotesk
[theme]
base = "dark"
primaryColor = "#cf9a30"
backgroundColor = "#0c0c0e"
secondaryBackgroundColor = "#161618"
textColor = "#f2efe8"
borderColor = "#2a2a2e"
linkColor = "#cf9a30"
font = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap, sans-serif"
chartCategoricalColors = ["#cf9a30", "#5a8fe0", "#e05a3a", "#3fa88f"]
# inline code (e.g. the raw model spellings) as graphite chips with light text
codeTextColor = "#f2efe8"
codeBackgroundColor = "#2a2a2e"
