[project]
name = "carpricepredictor"
version = "0.1.0"
description = "Used-car price prediction (US Craigslist 2021) with CatBoost and a Streamlit fair-price dashboard"
readme = "README.md"
authors = [
    { name = "Hugo Caravlho", email = "hugomnc317@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.8.0",
    "catboost>=1.2.10",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pykernel>=0.1.6",
    "scikit-learn>=1.9.1",
    "streamlit>=1.64.0",
]

[project.scripts]
carpricepredictor = "carpricepredictor:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pykernel>=0.1.6",
]
